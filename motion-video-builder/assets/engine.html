<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion — preview</title>
<!--
  Modes:  animation.html            preview with narration
          animation.html?deck       static review: one slide per screen at its final state (←/→, G = grid, #3 = slide 3)
          animation.html?render     used by render_frames.py (add &alpha for transparency)
  Fonts:  prefer local @font-face files (assets/fonts/...). Domain-locked kits may not load from file://.
-->
<style>
/* ================= PROJECT TOKENS — fill from style-sheet.md ================= */
:root{
  --bg-dark:#15171C;
  --bg-light:#F3F3EF;
  --accent:#C9A23A;
  --text-on-dark:#F3F3EF;
  --text-on-light:#1C2433;
  --font-display: Georgia, "Times New Roman", serif;
  --font-body: system-ui, sans-serif;
  --wipe-color: var(--accent);
  --stage-bg: #000;
}
/* @font-face { font-family:"Display"; src:url(assets/fonts/Display-Regular.woff2) format("woff2"); } */

/* ================= ENGINE — do not edit ================= */
html,body{margin:0;height:100%;background:#0d0e10;overflow:hidden}
#viewport{position:absolute;inset:0 0 56px 0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;overflow:hidden;flex:none}
.stage{position:absolute;left:0;top:0;overflow:hidden;transform-origin:0 0;background:var(--stage-bg)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;box-sizing:border-box}
#wipe{position:absolute;inset:0;background:var(--wipe-color);transform:translateX(-101%);z-index:1000;pointer-events:none}
#controls{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;gap:12px;align-items:center;padding:0 16px;
  background:#17181c;color:#ddd;font:13px/1 system-ui,sans-serif;box-sizing:border-box}
#controls button{background:#2a2c33;color:#eee;border:0;border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}
#scrub{flex:1}
#time{font-variant-numeric:tabular-nums;min-width:140px}
#slideName{min-width:180px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msg{color:#e8b04a}
body.render,body.render #viewport{background:transparent}
body.render #controls{display:none}
body.render #viewport{position:static;display:block}
body.alpha .stage{background:transparent}
body.alpha.render,html.alpha{background:transparent}
body.deck.grid{overflow:auto;height:auto}
body.deck.grid #controls,body.deck.grid #viewport{display:none}
#deck{padding:24px;display:none}
body.deck.grid #deck{display:block}
.deck-item{margin:0 auto 36px;max-width:1280px;cursor:pointer}
.deck-label{color:#aaa;font:13px system-ui,sans-serif;margin:0 0 8px}
.deck-box{position:relative;overflow:hidden;width:100%}
.deck-box .slide{opacity:1;visibility:visible}
body.deck.alpha #frame{background:repeating-conic-gradient(#999 0 25%,#666 0 50%) 0 0/32px 32px}
body.deck.alpha .deck-box{background:repeating-conic-gradient(#999 0 25%,#666 0 50%) 0 0/32px 32px}

/* ================= PROJECT STYLES — EXAMPLES ONLY: delete all of these and write layouts
   from style-sheet.md. Do not keep or adapt any example element (eyebrows, numbering, lines,
   colors) unless the client's design system has it. ================= */
.dark{background:var(--bg-dark);color:var(--text-on-dark)}
.light{background:var(--bg-light);color:var(--text-on-light)}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pad{padding:140px 160px}
.eyebrow{font:600 28px/1.2 var(--font-body);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:0 0 28px}
.title{font:400 140px/1.02 var(--font-display);margin:0}
.headline{font:400 84px/1.1 var(--font-display);margin:0 0 48px}
.sub{font:400 40px/1.35 var(--font-body);margin:32px 0 0}
.list{list-style:none;margin:0;padding:0}
.list li{font:400 44px/1.3 var(--font-body);margin:0 0 30px;display:flex;gap:28px}
.list .n{font:400 44px/1.3 var(--font-display);color:var(--accent);min-width:64px}
</style>
</head>
<body>
<div id="viewport"><div id="frame"><div id="stage" class="stage">

  <!-- ============ SLIDES — EXAMPLES ONLY: delete them and build from the approved design ============
       <section class="slide" data-start="SECONDS" data-name="Name" [data-transition="NAME"] [data-dir="left|right|up|down"] [data-transition-dur="0.8"]>
       Transitions: fade · cut · push · slide-over · reveal · rise · dip · wipe   (default = CONFIG.defaultTransition)
       Use ONLY the transitions the user picked in the brief.
       Animated element:  data-cue="SECONDS"  [data-anim="rise|fade|draw|reveal|pop|none|custom"]  [data-dur="0.7"]
       Leaves early:      data-out="SECONDS"  [data-out-dur="0.5"]
       Elements without data-cue are visible for the whole slide. -->

  <section class="slide dark center" data-start="0" data-name="Cover" data-transition="cut">
    <p class="eyebrow" data-cue="0.3" data-anim="fade">Course · Video 01</p>
    <h1 class="title" data-cue="0.6">Example title</h1>
    <p class="sub" data-cue="1.4">Subtitle line</p>
  </section>

  <section class="slide light pad" data-start="5" data-name="List">
    <h2 class="headline" data-cue="5.2">Three things</h2>
    <ul class="list">
      <li data-cue="6.5"><span class="n">01</span>First point, cued to the word</li>
      <li data-cue="8"><span class="n">02</span>Second point</li>
      <li data-cue="9.5"><span class="n">03</span>Third point</li>
    </ul>
  </section>

  <section class="slide dark pad" data-start="12" data-name="Chart">
    <p class="eyebrow" data-cue="12.3">Example chart</p>
    <svg width="1600" height="600" viewBox="0 0 1600 600">
      <polyline data-cue="13" data-anim="draw" data-dur="1.6" fill="none" stroke="var(--accent)" stroke-width="6"
        points="0,120 300,160 600,480 800,520 1100,260 1600,80"/>
    </svg>
  </section>

</div></div></div>

<div id="controls">
  <button id="play">Play</button>
  <span id="time">0:00.00</span>
  <input id="scrub" type="range" min="0" max="1" step="0.01" value="0">
  <span id="slideName"></span>
  <button id="copy" title="Copy current time">Copy time</button>
  <span id="msg"></span>
</div>

<script>
/* ================= CONFIG — per video ================= */
const CONFIG = {
  width: 1920, height: 1080, fps: 30,
  duration: null,                   // seconds; null = narration length (or last slide + 4 s)
  audio: 'audio/narration.mp3',     // null for no narration
  fonts: [],                        // families that MUST load, e.g. ['Display','Work Sans'] — render aborts otherwise
  defaultTransition: 'fade',        // from brief.md — the transition the user chose as default
  transitionDurations: {},          // overrides, e.g. { push: 0.9 }
  dipColor: '#000',                 // for 'dip' (fade through a color)
  wipeColor: null,                  // for 'wipe' (color bar); null = var(--wipe-color)
  riseDistance: 28
};

/* ================= CUSTOM ANIMATIONS — optional, pure functions of time =================
   (el, p, t) => {}   p = 0..1 progress, t = absolute seconds. No CSS transitions or timers. */
window.CUSTOM_ANIMS = {
  // grow: (el, p) => { el.style.opacity = p > 0 ? 1 : 0; el.style.transform = `scaleY(${p})`; }
};
window.CUSTOM_DURATIONS = { /* grow: 0.8 */ };

/* ================= ENGINE — do not edit ================= */
const Engine = (() => {
  const q = new URLSearchParams(location.search);
  const mode = q.has('render') ? 'render' : q.has('deck') ? 'deck' : 'preview';
  const alpha = q.has('alpha');
  if (alpha) { document.body.classList.add('alpha'); document.documentElement.classList.add('alpha'); }
  document.body.classList.add(mode);

  const W = CONFIG.width, H = CONFIG.height;
  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  const wipe = document.createElement('div'); wipe.id = 'wipe'; stage.appendChild(wipe);

  const clamp = x => x < 0 ? 0 : x > 1 ? 1 : x;
  const easeOut = p => 1 - Math.pow(1 - p, 3);
  const easeInOut = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;

  const durations = { rise: .7, fade: .7, draw: 1.2, reveal: .8, pop: .5, none: 0 };
  const anims = {
    rise:   (el, p) => { const e = easeOut(p); el.style.opacity = e; el.style.transform = `translateY(${(1-e)*CONFIG.riseDistance}px)`; },
    fade:   (el, p) => { el.style.opacity = easeOut(p); },
    none:   (el, p) => { el.style.opacity = p > 0 ? 1 : 0; },
    pop:    (el, p) => { const e = easeOut(p); el.style.opacity = e; el.style.transform = `scale(${.92 + .08*e})`; },
    reveal: (el, p) => { const e = easeInOut(p); el.style.opacity = p > 0 ? 1 : 0; el.style.clipPath = `inset(0 ${(1-e)*100}% 0 0)`; },
    draw:   (el, p) => {
      el.style.opacity = p > 0 ? 1 : 0;
      if (p >= 1) { el.style.strokeDasharray = ''; el.style.strokeDashoffset = ''; return; }
      if (el._len == null) { try { el._len = el.getTotalLength(); } catch (e) { return; } }
      el.style.strokeDasharray = el._len; el.style.strokeDashoffset = (1 - easeInOut(p)) * el._len;
    }
  };

  Object.assign(anims, window.CUSTOM_ANIMS || {});
  Object.assign(durations, window.CUSTOM_DURATIONS || {});

  const slides = [...stage.querySelectorAll('.slide')].map((el, i) => ({
    el, i,
    start: parseFloat(el.dataset.start || 0),
    transition: el.dataset.transition || CONFIG.defaultTransition || 'fade',
    name: el.dataset.name || 'Slide',
    items: [...el.querySelectorAll('[data-cue],[data-out]')]
  })).sort((a, b) => a.start - b.start);
  slides.forEach((s, i) => { s.n = String(i + 1).padStart(2, '0'); s.el.style.zIndex = i + 1; });

  function applyItem(el, t, deck) {
    const name = el.dataset.anim || 'rise';
    const fn = anims[name] || anims.rise;
    let p = 1;
    if (!deck && el.dataset.cue !== undefined) {
      const d = parseFloat(el.dataset.dur ?? durations[name] ?? .7);
      const c = parseFloat(el.dataset.cue);
      p = d > 0 ? clamp((t - c) / d) : (t >= c ? 1 : 0);
    }
    fn(el, p, t);
    if (!deck && el.dataset.out !== undefined) {
      const o = clamp((t - parseFloat(el.dataset.out)) / parseFloat(el.dataset.outDur || .5));
      if (o > 0) el.style.opacity = parseFloat(el.style.opacity === '' ? 1 : el.style.opacity) * (1 - easeInOut(o));
    }
  }

  function show(s, opacity, t) {
    s.el.style.visibility = 'visible';
    s.el.style.opacity = opacity;
    s.items.forEach(el => applyItem(el, t, false));
  }

  /* ---------- slide transitions (pure functions of time) ---------- */
  const TR_DUR = { fade: .7, cut: 0, push: .8, 'slide-over': .8, reveal: .8, rise: .7, dip: 1.0, wipe: .9 };
  const trDur = s => parseFloat(s.el.dataset.transitionDur ?? CONFIG.transitionDurations[s.transition] ?? TR_DUR[s.transition] ?? .7);
  const DIRS = { left: [1, 0], right: [-1, 0], up: [0, 1], down: [0, -1] };   // where the NEW slide comes from: left = enters from right moving left
  const dip = document.createElement('div');
  dip.style.cssText = `position:absolute;inset:0;background:${CONFIG.dipColor};opacity:0;z-index:999;pointer-events:none`;
  stage.appendChild(dip);
  if (CONFIG.wipeColor) wipe.style.background = CONFIG.wipeColor;

  function transition(s, prev, t) {          // returns true while prev must stay visible
    const name = s.transition, d = trDur(s);
    const raw = d > 0 ? clamp((t - s.start) / d) : 1, e = easeInOut(raw);
    const [dx, dy] = DIRS[s.el.dataset.dir || 'left'] || DIRS.left;
    const move = (el, k) => { el.style.transform = `translate(${dx * k * 100}%, ${dy * k * 100}%)`; };
    let prevOp = 1, curOp = 1;
    switch (name) {
      case 'fade':       curOp = e; if (alpha) prevOp = 1 - e; break;
      case 'push':       move(s.el, 1 - e); if (prev) move(prev.el, -e); break;
      case 'slide-over': move(s.el, 1 - e); if (alpha) prevOp = 1 - e; break;
      case 'reveal': {
        const k = (1 - e) * 100;
        s.el.style.clipPath = dx > 0 ? `inset(0 ${k}% 0 0)` : dx < 0 ? `inset(0 0 0 ${k}%)` : dy > 0 ? `inset(0 0 ${k}% 0)` : `inset(${k}% 0 0 0)`;
        if (alpha) prevOp = 1 - e; break;
      }
      case 'rise':       curOp = easeOut(raw); s.el.style.transform = `translateY(${(1 - easeOut(raw)) * 60}px)`; if (alpha) prevOp = 1 - e; break;
      case 'dip':
        if (raw < .5) { curOp = 0; if (alpha) prevOp = 1 - easeInOut(raw * 2); }
        else { prevOp = 0; curOp = alpha ? easeInOut((raw - .5) * 2) : 1; }
        if (!alpha && raw < 1) dip.style.opacity = raw < .5 ? easeInOut(raw * 2) : 1 - easeInOut((raw - .5) * 2);
        break;
      default: break;  // cut, wipe (wipe bar handled separately)
    }
    if (prev && raw < 1 && prevOp > 0) show(prev, prevOp, t);
    show(s, curOp, t);
  }

  let current = null;
  function render(t) {
    let cur = -1;
    for (let i = 0; i < slides.length; i++) if (t >= slides[i].start) cur = i;
    slides.forEach(s => { s.el.style.visibility = 'hidden'; s.el.style.opacity = 0; s.el.style.transform = ''; s.el.style.clipPath = ''; });
    dip.style.opacity = 0;
    if (cur >= 0) {
      const s = slides[cur];
      if (cur === 0 && !s.el.dataset.transition) show(s, 1, t);   // first slide: cut unless set explicitly
      else transition(s, slides[cur - 1] || null, t);
      current = s;
    }
    // wipe centered on the start of each wipe slide
    let wx = -101;
    const half = TR_DUR.wipe / 2;
    for (const s of slides) {
      if (s.transition !== 'wipe') continue;
      const half = trDur(s) / 2;
      if (t >= s.start - half && t < s.start) wx = -101 + 101 * easeInOut((t - (s.start - half)) / half);
      else if (t >= s.start && t < s.start + half) wx = 101 * easeInOut((t - s.start) / half);
    }
    wipe.style.transform = `translateX(${wx}%)`;
  }

  /* ---------- duration ---------- */
  const lastStart = slides.length ? slides[slides.length - 1].start : 0;
  let duration = CONFIG.duration || lastStart + 4;

  /* ---------- readiness (fonts + images) ---------- */
  let missingFonts = [];
  const ready = (async () => {
    await document.fonts.ready;
    for (const f of CONFIG.fonts) {
      try { const faces = await document.fonts.load(`40px "${f}"`); if (!faces.length) missingFonts.push(f); }
      catch (e) { missingFonts.push(f); }
    }
    await Promise.all([...document.images].map(img => img.decode().catch(() => {})));
    window.__ready = true;
  })();

  window.__info = () => ({ width: W, height: H, fps: CONFIG.fps, duration: CONFIG.duration, audio: CONFIG.audio,
    lastStart, missingFonts, slides: slides.map(s => ({ n: s.n, name: s.name, start: s.start })) });
  window.__seek = t => { render(t); return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); };

  const fmt = t => { const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s.toFixed(2).padStart(5, '0')}`; };

  /* ---------- deck mode: one slide per screen (static review) ---------- */
  if (mode === 'deck') {
    const ctr = document.getElementById('controls');
    ctr.innerHTML = '<button id="prev">‹ Prev</button><span id="pos" style="font-variant-numeric:tabular-nums;min-width:70px;text-align:center"></span>'
      + '<button id="next">Next ›</button><span id="slideName" style="flex:1"></span><button id="gridBtn">Grid</button>';
    const fitDeck = () => {
      const sc = Math.min(innerWidth / W, (innerHeight - 56) / H);
      frame.style.width = W * sc + 'px'; frame.style.height = H * sc + 'px';
      stage.style.transform = `scale(${sc})`;
    };
    let idx = Math.max(0, Math.min(slides.length - 1, (parseInt(location.hash.slice(1)) || 1) - 1));
    const go = i => {
      idx = Math.max(0, Math.min(slides.length - 1, i));
      slides.forEach(s => { s.el.style.visibility = 'hidden'; s.el.style.opacity = 0; s.el.style.transform = ''; s.el.style.clipPath = ''; });
      dip.style.opacity = 0;
      const s = slides[idx]; s.el.style.visibility = 'visible'; s.el.style.opacity = 1;
      s.items.forEach(el => applyItem(el, Infinity, true));
      wipe.style.transform = 'translateX(-101%)';
      document.getElementById('pos').textContent = `${s.n} / ${String(slides.length).padStart(2, '0')}`;
      document.getElementById('slideName').textContent = `${s.name} · starts ${fmt(s.start)}`;
      history.replaceState(null, '', '#' + (idx + 1));
    };
    // grid overview (clones, so the main stage keeps its slides)
    const deck = document.createElement('div'); deck.id = 'deck'; document.body.appendChild(deck);
    const boxes = [];
    const buildGrid = () => {
      if (boxes.length) return;
      slides.forEach((s, i) => {
        const item = document.createElement('div'); item.className = 'deck-item';
        item.innerHTML = `<div class="deck-label">${s.n} · ${s.name} · starts ${fmt(s.start)}</div>`;
        const box = document.createElement('div'); box.className = 'deck-box';
        const st = document.createElement('div'); st.className = 'stage';
        st.style.width = W + 'px'; st.style.height = H + 'px';
        const c = s.el.cloneNode(true); c.style.opacity = 1; c.style.visibility = 'visible';
        c.querySelectorAll('[data-cue],[data-out]').forEach(el => applyItem(el, Infinity, true));
        st.appendChild(c); box.appendChild(st); item.appendChild(box); deck.appendChild(item);
        item.onclick = () => { toggleGrid(false); go(i); };
        boxes.push([box, st]);
      });
    };
    const fitGrid = () => boxes.forEach(([box, st]) => { const sc = box.clientWidth / W; st.style.transform = `scale(${sc})`; box.style.height = H * sc + 'px'; });
    const toggleGrid = on => { buildGrid(); document.body.classList.toggle('grid', on); if (on) fitGrid(); };
    document.getElementById('prev').onclick = () => go(idx - 1);
    document.getElementById('next').onclick = () => go(idx + 1);
    document.getElementById('gridBtn').onclick = () => toggleGrid(true);
    addEventListener('keydown', e => {
      const grid = document.body.classList.contains('grid');
      if (e.key === 'g' || e.key === 'G' || (grid && e.key === 'Escape')) return toggleGrid(!grid);
      if (grid) return;
      if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(idx + 1); }
      else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); go(idx - 1); }
      else if (e.key === 'Home') go(0); else if (e.key === 'End') go(slides.length - 1);
    });
    frame.onclick = () => go(idx + 1);
    addEventListener('resize', () => { fitDeck(); fitGrid(); });
    fitDeck(); go(idx);
    return { anims, durations, render };
  }

  /* ---------- render mode ---------- */
  if (mode === 'render') {
    frame.style.width = W + 'px'; frame.style.height = H + 'px';
    window.__still = idx => {          // one slide at its final state (for review stills)
      slides.forEach(s => { s.el.style.visibility = 'hidden'; s.el.style.opacity = 0; s.el.style.transform = ''; s.el.style.clipPath = ''; });
      dip.style.opacity = 0;
      const s = slides[idx]; s.el.style.visibility = 'visible'; s.el.style.opacity = 1;
      s.items.forEach(el => applyItem(el, Infinity, true));
      wipe.style.transform = 'translateX(-101%)';
      return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    };
    render(0);
    return { anims, durations, render };
  }

  /* ---------- preview mode ---------- */
  const $ = id => document.getElementById(id);
  const scrub = $('scrub'), timeEl = $('time'), nameEl = $('slideName'), msg = $('msg'), playBtn = $('play');
  function fit() {
    const vw = innerWidth, vh = innerHeight - 56, sc = Math.min(vw / W, vh / H);
    frame.style.width = W * sc + 'px'; frame.style.height = H * sc + 'px';
    stage.style.transform = `scale(${sc})`;
  }
  addEventListener('resize', fit); fit();

  let audio = null, t = 0, playing = false, t0 = 0, wall = 0;
  if (CONFIG.audio) {
    audio = new Audio(CONFIG.audio); audio.preload = 'auto';
    audio.addEventListener('loadedmetadata', () => { if (!CONFIG.duration) duration = audio.duration; scrub.max = duration; });
    audio.addEventListener('error', () => { msg.textContent = 'Narration not found — playing silent'; audio = null; });
  }
  scrub.max = duration;
  const now = () => playing ? (audio ? audio.currentTime : t0 + (performance.now() - wall) / 1000) : t;
  function ui() {
    timeEl.textContent = `${fmt(t)} / ${fmt(duration)}`;
    scrub.value = t;
    nameEl.textContent = current ? `${current.n} · ${current.name}` : '';
    playBtn.textContent = playing ? 'Pause' : 'Play';
  }
  function play() {
    if (t >= duration) t = 0;
    if (audio) { audio.currentTime = t; audio.play().catch(() => { msg.textContent = 'Click Play again to turn sound on'; playing = false; ui(); }); }
    else { t0 = t; wall = performance.now(); }
    playing = true; ui();
  }
  function pause() { t = now(); if (audio) audio.pause(); playing = false; ui(); }
  function seek(x) {
    t = Math.max(0, Math.min(duration, x));
    if (audio) audio.currentTime = t;
    if (playing && !audio) { t0 = t; wall = performance.now(); }
    render(t); ui();
  }
  playBtn.onclick = () => playing ? pause() : play();
  scrub.oninput = () => seek(parseFloat(scrub.value));
  $('copy').onclick = () => navigator.clipboard?.writeText(fmt(t)).then(() => { msg.textContent = 'Copied ' + fmt(t); });
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
    const step = e.shiftKey ? 5 : 1, f = 1 / CONFIG.fps;
    if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
    else if (e.key === 'ArrowRight') seek(now() + step);
    else if (e.key === 'ArrowLeft') seek(now() - step);
    else if (e.key === '.') { if (playing) pause(); seek(t + f); }
    else if (e.key === ',') { if (playing) pause(); seek(t - f); }
  });
  (function tick() {
    if (playing) { t = now(); if (t >= duration) { t = duration; pause(); } render(t); ui(); }
    requestAnimationFrame(tick);
  })();
  ready.then(() => { render(t); ui(); if (missingFonts.length) msg.textContent = 'Fonts not loaded: ' + missingFonts.join(', '); });
  render(0); ui();
  return { anims, durations, render, seek };
})();
</script>
</body>
</html>
